[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clusterprep"
version = "0.3.0"
description = "Radio and Chandra FITS preparation for PyTorch training"
requires-python = ">=3.10"
dependencies = ["numpy", "astropy", "reproject", "torch", "torchvision", "scikit-learn", "iterative-stratification>=0.1.9", "matplotlib", "tqdm"]

[project.optional-dependencies]
test = ["pytest>=8"]
analysis = ["pandas", "jupyterlab", "nbformat", "nbclient", "ipykernel"]
download = ["requests", "beautifulsoup4"]
scattering = ["kymatio>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]
